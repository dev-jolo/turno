<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Open Play — Pickleball Rotation</title>
<meta name="description" content="Randomized pickleball open-play rotation, queue, and court manager. Works offline." />
<meta name="theme-color" content="#0F1B1A" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./favicon.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Open Play" />
<style>
  :root{
    --ink:#0F1B1A; --surface:#16302C; --surface-2:#1f3a35; --raise:#24463f;
    --ball:#D6F549; --ball-dim:#b9d63f; --line:#F4F7F0; --coral:#FF6B5B;
    --muted:#7e978f; --sage:#a9c3b6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --r:16px; --pad: max(16px, env(safe-area-inset-left)) ;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans); background:var(--ink); color:var(--line);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit}
  input{font-family:inherit}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px}

  /* ---- top bar ---- */
  header{
    position:sticky; top:0; z-index:20; background:rgba(15,27,26,.86);
    backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid #ffffff14; padding-top:env(safe-area-inset-top);
  }
  .bar{display:flex; align-items:center; justify-content:space-between; height:56px}
  .mark{display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.04em}
  .mark .ball{width:16px;height:16px;border-radius:50%;background:var(--ball);
    box-shadow:inset -3px -3px 0 #00000022; position:relative; flex:0 0 auto}
  .mark .ball::after{content:"";position:absolute;inset:4px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, transparent 1px, transparent 1.4px),
    radial-gradient(circle at 30% 35%, #16302c 1.1px, transparent 1.2px),
    radial-gradient(circle at 70% 40%, #16302c 1.1px, transparent 1.2px),
    radial-gradient(circle at 55% 70%, #16302c 1.1px, transparent 1.2px)}
  .mark b{font-size:15px}
  .mark span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .round-pill{display:flex;align-items:center;gap:8px}
  .round-pill .n{font-family:var(--mono);font-size:13px;color:var(--sage);
    background:#ffffff10;padding:5px 10px;border-radius:999px}
  .iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:#ffffff10;color:var(--sage)}
  .iconbtn:hover{background:#ffffff1c;color:var(--line)}
  .iconbtn svg{width:19px;height:19px}

  /* ---- section headers (eyebrows) ---- */
  .eyebrow{display:flex;align-items:baseline;gap:10px;margin:26px 2px 12px}
  .eyebrow h2{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin:0}
  .eyebrow .tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .eyebrow .rule{flex:1;height:1px;background:#ffffff14}

  /* ---- court card: the signature ---- */
  .courts{display:grid;gap:14px}
  .court{
    background:var(--surface); border:1px solid #ffffff12; border-radius:var(--r);
    overflow:hidden; position:relative;
  }
  .court .top{display:flex;align-items:center;justify-content:space-between;
    padding:11px 14px 9px; border-bottom:1px solid #ffffff10}
  .court .top .name{font-weight:800;letter-spacing:.06em;font-size:13px;text-transform:uppercase}
  .court .top .name em{color:var(--ball);font-style:normal}
  .court .live{font-family:var(--mono);font-size:11px;color:var(--muted);
    display:flex;align-items:center;gap:6px}
  .court .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ball)}
  /* the playing surface */
  .surface{
    position:relative; display:grid; grid-template-columns:1fr 1fr; min-height:118px;
    background:
      linear-gradient(0deg,#ffffff05,#ffffff05),
      var(--surface-2);
  }
  .surface::before{ /* net */
    content:""; position:absolute; top:8px; bottom:8px; left:50%; width:2px;
    transform:translateX(-50%);
    background:repeating-linear-gradient(#f4f7f0aa 0 5px, transparent 5px 9px);
  }
  .side{padding:12px 14px; display:flex; flex-direction:column; gap:8px; justify-content:center}
  .side.right{align-items:flex-end; text-align:right}
  .side .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted)}
  .player{font-size:16px;font-weight:650;display:flex;align-items:center;gap:8px}
  .player .g{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .court .foot{padding:11px 12px;display:flex;gap:8px;border-top:1px solid #ffffff10}
  .btn-done{flex:1;background:var(--ball);color:#10231d;font-weight:800;letter-spacing:.02em;
    border-radius:11px;padding:13px;font-size:14.5px}
  .btn-done:active{transform:translateY(1px)}
  .btn-ghost{background:#ffffff10;color:var(--sage);border-radius:11px;padding:13px 14px;font-weight:700;font-size:13px}
  .btn-ghost:hover{background:#ffffff1c;color:var(--line)}
  .court.empty .surface{display:flex;align-items:center;justify-content:center;min-height:96px}
  .empty-msg{color:var(--muted);font-size:13.5px;text-align:center;padding:18px;max-width:80%}
  .empty-msg b{color:var(--sage)}

  /* ---- queue ---- */
  .list{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid #ffffff10;border-radius:13px;padding:11px 12px}
  .pos{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--sage);
    width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:700;flex:0 0 auto}
  .row.next .pos{background:var(--ball)}
  .row .who{flex:1;min-width:0}
  .row .who .nm{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .who .sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .chip-btn{font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:9px;
    background:#ffffff10;color:var(--sage);flex:0 0 auto}
  .chip-btn:hover{background:#ffffff1c;color:var(--line)}
  .chip-btn.warm{color:var(--coral)}
  .chip-btn.warm:hover{background:#ff6b5b1f;color:var(--coral)}
  .chip-btn.go{background:var(--ball);color:#10231d}

  .bench .row{background:#1b2c28;border-style:dashed;border-color:#ffffff1f;opacity:.92}
  .bench .row .nm{color:var(--sage)}

  /* ---- add control ---- */
  .addbar{display:flex;gap:8px;margin-top:10px}
  .addbar input{flex:1;background:var(--surface);border:1px solid #ffffff1a;color:var(--line);
    border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
  .addbar input:focus{border-color:var(--ball)}
  .addbar input::placeholder{color:var(--muted)}
  .addbar button{background:var(--ball);color:#10231d;font-weight:800;border-radius:12px;padding:0 18px;font-size:15px}

  /* ---- setup ---- */
  .hero{padding:30px 2px 8px}
  .hero h1{font-size:30px;line-height:1.08;letter-spacing:-.01em;margin:0 0 8px;font-weight:820}
  .hero h1 em{font-style:normal;color:var(--ball)}
  .hero p{color:var(--sage);margin:0;font-size:15px;max-width:42ch}
  .panel{background:var(--surface);border:1px solid #ffffff12;border-radius:var(--r);padding:16px;margin-top:18px}
  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
  .field + .field{border-top:1px solid #ffffff0e}
  .field .k{font-weight:700;font-size:14.5px}
  .field .k small{display:block;color:var(--muted);font-weight:500;font-size:12px}
  .stepper{display:flex;align-items:center;gap:4px;background:#ffffff10;border-radius:11px;padding:4px}
  .stepper button{width:36px;height:34px;border-radius:8px;font-size:20px;font-weight:700;color:var(--sage)}
  .stepper button:hover{background:#ffffff14;color:var(--line)}
  .stepper .v{font-family:var(--mono);min-width:30px;text-align:center;font-size:16px;font-weight:700}
  .seg{display:flex;background:#ffffff10;border-radius:11px;padding:4px;gap:4px}
  .seg button{padding:9px 14px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--ball);color:#10231d}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{display:flex;align-items:center;gap:8px;background:#ffffff10;border-radius:999px;
    padding:8px 8px 8px 14px;font-size:14px;font-weight:600}
  .chip button{width:20px;height:20px;border-radius:50%;background:#ffffff14;color:var(--sage);
    display:grid;place-items:center;font-size:13px;line-height:1}
  .chip button:hover{background:var(--coral);color:#10231d}
  .start{position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,var(--ink) 38%)}
  .start .inner{max-width:560px;margin:0 auto}
  .start button{width:100%;background:var(--ball);color:#10231d;font-weight:820;font-size:16px;
    border-radius:14px;padding:16px;letter-spacing:.02em}
  .start button:disabled{background:#ffffff14;color:var(--muted);cursor:not-allowed}
  .hint{color:var(--muted);font-size:12.5px;text-align:center;margin-top:8px}

  .muted{color:var(--muted)}
  .empty-block{color:var(--muted);font-size:14px;padding:14px 2px}

  /* settings sheet */
  .sheet-bg{position:fixed;inset:0;background:#00000080;z-index:40;display:none}
  .sheet-bg.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
    border-top-left-radius:22px;border-top-right-radius:22px;border-top:1px solid #ffffff1a;
    padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);
    transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
  .sheet.open{transform:translateY(0)}
  .grab{width:40px;height:4px;border-radius:2px;background:#ffffff2a;margin:8px auto 6px}
  .sheet h3{margin:6px 2px 2px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .danger{width:100%;margin-top:14px;background:#ff6b5b18;color:var(--coral);font-weight:800;
    border-radius:12px;padding:14px;font-size:14px}
  .danger:hover{background:#ff6b5b28}

  @media (prefers-reduced-motion: reduce){ .sheet{transition:none} }
  :focus-visible{outline:2px solid var(--ball);outline-offset:2px}
  @media (min-width:560px){ .courts{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="mark"><span class="ball"></span><b>OPEN&nbsp;PLAY</b></div>
    <div class="round-pill">
      <span class="n" id="roundTag" hidden>Round 1</span>
      <button class="iconbtn" id="gear" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 3.6 15a1.65 1.65 0 0 0-1.51-1H2a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 3.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 8 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.2.62.78 1.05 1.43 1H21a2 2 0 0 1 0 4h-.09c-.65 0-1.23.43-1.51 1z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<!-- settings sheet -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Session settings">
  <div class="grab"></div>
  <h3>Session</h3>
  <div class="field">
    <div class="k">Courts reserved<small>How many courts are running</small></div>
    <div class="stepper">
      <button id="cMinus" aria-label="Fewer courts">–</button>
      <span class="v" id="cVal">2</span>
      <button id="cPlus" aria-label="More courts">+</button>
    </div>
  </div>
  <div class="field">
    <div class="k">Format<small>Players per court</small></div>
    <div class="seg" id="modeSeg">
      <button data-mode="doubles" aria-pressed="true">Doubles · 4</button>
      <button data-mode="singles" aria-pressed="false">Singles · 2</button>
    </div>
  </div>
  <button class="danger" id="resetBtn">Reset session</button>
</div>

<script>
"use strict";

/* ============================================================
   Storage — fully guarded. Source of truth is the in-memory
   `state`; this only mirrors it so a phone refresh keeps the
   session. No-ops safely if storage is unavailable (e.g. the
   Claude preview sandbox). No database, nothing leaves device.
   ============================================================ */
const Store = {
  key: "openplay_state_v1",
  ok: (() => { try { const k="__t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; } catch(_) { return false; } })(),
  save(s){ if(!this.ok) return; try{ localStorage.setItem(this.key, JSON.stringify(s)); }catch(_){} },
  load(){ if(!this.ok) return null; try{ const v=localStorage.getItem(this.key); return v?JSON.parse(v):null; }catch(_){ return null; } },
  clear(){ if(!this.ok) return; try{ localStorage.removeItem(this.key); }catch(_){} }
};

/* ============================================================
   State
   ============================================================ */
let seq = 1;                 // monotonic counter for join/return order
const PARTNER_W = 3, OPP_W = 1;

function blankState(){
  return {
    started:false,
    courtsCount:2,
    mode:"doubles",          // doubles=4, singles=2
    round:1,
    players:[],              // {id,name,games,status:'waiting'|'playing'|'hold',enteredAt,holdAfter,partners:{},opps:{}}
    courts:[]                // each: {teamA:[ids], teamB:[ids]}  | null when empty
  };
}
let state = Store.load() || blankState();
// restore seq above any saved enteredAt so ordering stays consistent
if (state.players && state.players.length){
  seq = Math.max(seq, ...state.players.map(p=>p.enteredAt||0)) + 1;
}

function perCourt(){ return state.mode === "singles" ? 2 : 4; }
function teamSize(){ return state.mode === "singles" ? 1 : 2; }
function byId(id){ return state.players.find(p=>p.id===id); }

function persist(){ Store.save(state); }

/* ============================================================
   Roster operations
   ============================================================ */
function genId(){ return "p" + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3); }

function minGames(pred){
  const pool = state.players.filter(pred || (()=>true));
  if (!pool.length) return 0;
  return Math.min(...pool.map(p=>p.games));
}

function addPlayer(name){
  name = (name||"").trim();
  if (!name) return;
  // mid-session joiners start at the current min game count so they catch up but don't hog
  const base = state.started ? minGames(p=>p.status!=="hold") : 0;
  state.players.push({
    id:genId(), name, games:base, status:"waiting",
    enteredAt:seq++, holdAfter:false, partners:{}, opps:{}
  });
}

function removePlayer(id){
  // pull from any court they're on (the court keeps playing short-handed until "Game done")
  state.courts.forEach(c=>{ if(c){ c.teamA=c.teamA.filter(x=>x!==id); c.teamB=c.teamB.filter(x=>x!==id);} });
  state.players = state.players.filter(p=>p.id!==id);
}

function isPlaying(id){
  return state.courts.some(c=>c && (c.teamA.includes(id)||c.teamB.includes(id)));
}

function holdPlayer(id){
  const p = byId(id); if(!p) return;
  if (isPlaying(id)){
    p.holdAfter = true;           // finish the current game, then bench
  } else {
    p.status = "hold"; p.holdAfter = false;
  }
}

function returnPlayer(id){
  const p = byId(id); if(!p) return;
  p.holdAfter = false;
  p.status = "waiting";
  // slot back in fairly: don't leapfrog everyone, don't get buried — match current min, go to back of that tier
  p.games = Math.max(p.games, minGames(q=>q.status==="waiting" && q.id!==id));
  p.enteredAt = seq++;
}

/* ============================================================
   Rotation engine
   ============================================================ */
function waitingSorted(){
  return state.players
    .filter(p=>p.status==="waiting")
    .sort((a,b)=> a.games-b.games || a.enteredAt-b.enteredAt);
}

// cost of a proposed match: heavily penalize repeat partners, lightly penalize repeat opponents
function pairCost(ids, teamA, teamB){
  const get=(m,x)=> m[x]||0;
  let cost=0;
  const teams=[teamA,teamB];
  for(const t of teams){
    for(let i=0;i<t.length;i++) for(let j=i+1;j<t.length;j++){
      cost += PARTNER_W * get(byId(t[i]).partners, t[j]);
    }
  }
  for(const a of teamA) for(const b of teamB){
    cost += OPP_W * get(byId(a).opps, b);
  }
  return cost;
}

// choose the team split (of a fixed group) that reuses partners/opponents least
function bestSplit(ids){
  const ts = teamSize();
  if (ts===1){ // singles
    return {teamA:[ids[0]], teamB:[ids[1]], cost:pairCost(ids,[ids[0]],[ids[1]])};
  }
  // doubles: 3 distinct splits of 4
  const splits=[ [[0,1],[2,3]], [[0,2],[1,3]], [[0,3],[1,2]] ];
  let best=null;
  for(const [a,b] of splits){
    const teamA=[ids[a[0]],ids[a[1]]], teamB=[ids[b[0]],ids[b[1]]];
    const c=pairCost(ids,teamA,teamB);
    if(!best || c<best.cost || (c===best.cost && Math.random()<0.5)) best={teamA,teamB,cost:c};
  }
  return best;
}

function combinations(arr,k){
  const res=[]; const n=arr.length;
  (function go(start,combo){
    if(combo.length===k){ res.push(combo.slice()); return; }
    for(let i=start;i<n;i++){ combo.push(arr[i]); go(i+1,combo); combo.pop(); }
  })(0,[]);
  return res;
}

// pick the next group for ONE court: strict fairness, with same-tier swaps to improve mixing
function selectGroup(){
  const w = waitingSorted();
  const need = perCourt();
  if (w.length < need) return null;
  const base = w.slice(0, need);
  const baseGames = base.reduce((s,p)=>s+p.games,0);
  const pool = w.slice(0, Math.min(w.length, need+3)).map(p=>p.id);
  let best = bestSplit(base.map(p=>p.id)); best.ids = base.map(p=>p.id);
  for(const combo of combinations(pool, need)){
    const g = combo.reduce((s,id)=>s+byId(id).games,0);
    if (g > baseGames) continue;            // never accept a less-fair group
    const s = bestSplit(combo);
    if (s.cost < best.cost){ best = s; best.ids = combo; }
  }
  return best;
}

function assignEmptyCourts(){
  for(let i=0;i<state.courtsCount;i++){
    if (state.courts[i]) continue;          // occupied
    const grp = selectGroup();
    if (!grp) break;                        // not enough players for another court
    grp.teamA.concat(grp.teamB).forEach(id=>{ byId(id).status="playing"; });
    state.courts[i] = { teamA:grp.teamA, teamB:grp.teamB };
  }
}

function finishCourt(i){
  const c = state.courts[i]; if(!c) return;
  const teamA=c.teamA, teamB=c.teamB;
  // record history
  const bump=(m,x)=>{ m[x]=(m[x]||0)+1; };
  for(const t of [teamA,teamB]){
    for(let a=0;a<t.length;a++) for(let b=0;b<t.length;b++) if(a!==b) bump(byId(t[a]).partners, t[b]);
  }
  for(const a of teamA) for(const b of teamB){ bump(byId(a).opps,b); bump(byId(b).opps,a); }
  // count the game + send players back to queue or bench
  [...teamA,...teamB].forEach(id=>{
    const p=byId(id); if(!p) return;
    p.games++;
    if (p.holdAfter){ p.status="hold"; p.holdAfter=false; }
    else { p.status="waiting"; p.enteredAt=seq++; }
  });
  state.courts[i] = null;
  state.round++;
  assignEmptyCourts();
}

// Synchronized fresh round: count every current game, re-pool everyone, redraw all
// courts together. Best cross-court mixing — use at a natural break.
function mixAllCourts(){
  const bump=(m,x)=>{ m[x]=(m[x]||0)+1; };
  state.courts.forEach(c=>{ if(!c) return;
    for(const t of [c.teamA,c.teamB]) for(let a=0;a<t.length;a++) for(let b=0;b<t.length;b++) if(a!==b) bump(byId(t[a]).partners, t[b]);
    for(const a of c.teamA) for(const b of c.teamB){ bump(byId(a).opps,b); bump(byId(b).opps,a); }
    [...c.teamA,...c.teamB].forEach(id=>{ const p=byId(id); if(!p) return;
      p.games++;
      if(p.holdAfter){ p.status="hold"; p.holdAfter=false; } else { p.status="waiting"; p.enteredAt=seq++; }
    });
  });
  state.courts = new Array(state.courtsCount).fill(null);
  state.round++;
  assignEmptyCourts();
}

function startSession(){
  state.started = true;
  state.round = 1;
  state.courts = new Array(state.courtsCount).fill(null);
  assignEmptyCourts();
}

/* ============================================================
   Rendering
   ============================================================ */
const app = document.getElementById("app");
const roundTag = document.getElementById("roundTag");

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function pluralCourt(n){ return n+" court"+(n===1?"":"s"); }

function render(){
  persist();
  if (!state.started){ renderSetup(); roundTag.hidden = true; }
  else { renderLive(); roundTag.hidden = false; roundTag.textContent = "Round "+state.round; }
  syncSheet();
}

function renderSetup(){
  const n = state.players.length;
  const enough = n >= perCourt();
  app.innerHTML = `
    <section class="hero">
      <h1>Run a fair <em>open play</em>.</h1>
      <p>Add everyone who showed up, set your courts, and the app randomizes who plays — mixing partners and keeping games even. No sign-in, works offline.</p>
    </section>

    <div class="panel">
      <div class="field">
        <div class="k">Courts reserved<small>${pluralCourt(state.courtsCount)} running tonight</small></div>
        <div class="stepper">
          <button id="suMinus" aria-label="Fewer courts">–</button>
          <span class="v">${state.courtsCount}</span>
          <button id="suPlus" aria-label="More courts">+</button>
        </div>
      </div>
      <div class="field">
        <div class="k">Format<small>${state.mode==="singles"?"2 players per court":"4 players per court"}</small></div>
        <div class="seg" id="suMode">
          <button data-mode="doubles" aria-pressed="${state.mode==="doubles"}">Doubles · 4</button>
          <button data-mode="singles" aria-pressed="${state.mode==="singles"}">Singles · 2</button>
        </div>
      </div>
    </div>

    <div class="eyebrow"><h2>Players</h2><span class="rule"></span><span class="tag">${n}</span></div>
    <div class="addbar">
      <input id="rosterInput" placeholder="Add a name — or paste a list" autocomplete="off" enterkeyhint="done" />
      <button id="rosterAdd">Add</button>
    </div>
    ${ n ? `<div class="chips" id="chips">${
        state.players.map(p=>`<span class="chip">${esc(p.name)}<button data-rm="${p.id}" aria-label="Remove ${esc(p.name)}">×</button></span>`).join("")
      }</div>` : `<p class="empty-block">No one yet. Add a few names to begin — you can paste a comma- or line-separated list too.</p>` }

    <div class="start"><div class="inner">
      <button id="startBtn" ${enough?"":"disabled"}>${ enough ? "Start session" : `Need ${perCourt()-n} more to fill a court` }</button>
      ${ enough ? `<div class="hint">${n} players · ${pluralCourt(state.courtsCount)} · ${Math.min(state.courtsCount, Math.floor(n/perCourt()))} on court, ${n-Math.min(state.courtsCount,Math.floor(n/perCourt()))*perCourt()} waiting</div>` : "" }
    </div></div>
  `;

  document.getElementById("suMinus").onclick = ()=>{ state.courtsCount=Math.max(1,state.courtsCount-1); render(); };
  document.getElementById("suPlus").onclick  = ()=>{ state.courtsCount=Math.min(12,state.courtsCount+1); render(); };
  document.querySelectorAll("#suMode button").forEach(b=> b.onclick=()=>{ state.mode=b.dataset.mode; render(); });
  const input = document.getElementById("rosterInput");
  const doAdd = ()=>{
    const raw = input.value;
    raw.split(/[,\n]/).map(s=>s.trim()).filter(Boolean).forEach(addPlayer);
    input.value=""; render(); document.getElementById("rosterInput").focus();
  };
  document.getElementById("rosterAdd").onclick = doAdd;
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") doAdd(); });
  document.querySelectorAll("[data-rm]").forEach(b=> b.onclick=()=>{ removePlayer(b.dataset.rm); render(); });
  document.getElementById("startBtn").onclick = ()=>{ if(state.players.length>=perCourt()){ startSession(); render(); } };
}

function playerLine(id, alignRight){
  const p = byId(id); if(!p) return "";
  return `<div class="player">${alignRight?`<span class="g">${p.games}g</span> `:""}${esc(p.name)}${alignRight?"":` <span class="g">${p.games}g</span>`}</div>`;
}

function courtCard(i){
  const c = state.courts[i];
  const label = `Court <em>${i+1}</em>`;
  if (!c){
    const waiting = waitingSorted().length;
    const need = perCourt();
    const msg = waiting>=need
      ? `Filling…`
      : `<b>Open.</b> Needs ${need} waiting players to start a game — ${waiting} ready.`;
    return `<div class="court empty"><div class="top"><span class="name">${label}</span><span class="live" style="color:var(--muted)">idle</span></div>
      <div class="surface"><div class="empty-msg">${msg}</div></div></div>`;
  }
  const ts = teamSize();
  return `<div class="court">
    <div class="top"><span class="name">${label}</span><span class="live">on court</span></div>
    <div class="surface">
      <div class="side left">
        <span class="lbl">${ts===1?"Player":"Team A"}</span>
        ${c.teamA.map(id=>playerLine(id,false)).join("")}
      </div>
      <div class="side right">
        <span class="lbl">${ts===1?"Player":"Team B"}</span>
        ${c.teamB.map(id=>playerLine(id,true)).join("")}
      </div>
    </div>
    <div class="foot">
      <button class="btn-done" data-done="${i}">Game done · rotate</button>
      <button class="btn-ghost" data-clear="${i}" title="Clear court without counting a game">Clear</button>
    </div>
  </div>`;
}

function renderLive(){
  const queue = waitingSorted();
  const bench = state.players.filter(p=>p.status==="hold");
  const playingCount = state.courts.filter(Boolean).reduce((s,c)=>s+c.teamA.length+c.teamB.length,0);

  app.innerHTML = `
    <div class="eyebrow"><h2>Courts</h2><span class="rule"></span><span class="tag">${playingCount} playing</span></div>
    <div class="courts">${ Array.from({length:state.courtsCount},(_,i)=>courtCard(i)).join("") }</div>
    ${ state.courts.some(Boolean) ? `<button class="btn-ghost" id="mixAll" style="width:100%;margin-top:12px;padding:14px">Mix all courts · fresh round</button>` : "" }

    <div class="eyebrow"><h2>Up next</h2><span class="rule"></span><span class="tag">${queue.length} waiting</span></div>
    ${ queue.length ? `<div class="list">${ queue.map((p,idx)=>`
      <div class="row ${idx<perCourt()?"next":""}">
        <span class="pos">${idx+1}</span>
        <div class="who"><div class="nm">${esc(p.name)}</div><div class="sub">${p.games} game${p.games===1?"":"s"} played</div></div>
        <button class="chip-btn warm" data-hold="${p.id}">Hold</button>
      </div>`).join("") }</div>`
      : `<p class="empty-block">Everyone's either on court or on hold.</p>` }

    ${ bench.length ? `
      <div class="eyebrow"><h2>On hold</h2><span class="rule"></span><span class="tag">${bench.length}</span></div>
      <div class="list bench">${ bench.map(p=>`
        <div class="row">
          <span class="pos" style="background:var(--coral)">⏸</span>
          <div class="who"><div class="nm">${esc(p.name)}</div><div class="sub">stepped out · ${p.games} played</div></div>
          <button class="chip-btn go" data-return="${p.id}">Add back</button>
          <button class="chip-btn" data-remove="${p.id}">Remove</button>
        </div>`).join("") }</div>` : "" }

    <div class="eyebrow"><h2>Add player</h2><span class="rule"></span></div>
    <div class="addbar">
      <input id="liveInput" placeholder="Latecomer's name" autocomplete="off" enterkeyhint="done" />
      <button id="liveAdd">Add</button>
    </div>
    <p class="hint" style="text-align:left;margin:8px 2px 0">New players join at the current game count so they catch up fairly.</p>
  `;

  app.querySelectorAll("[data-done]").forEach(b=> b.onclick=()=>{ finishCourt(+b.dataset.done); render(); });
  const mix=document.getElementById("mixAll");
  if(mix) mix.onclick=()=>{ if(confirm("Count the current games and re-randomize everyone across all courts?")){ mixAllCourts(); render(); } };
  app.querySelectorAll("[data-clear]").forEach(b=> b.onclick=()=>{
    const i=+b.dataset.clear, c=state.courts[i];
    if(c){ [...c.teamA,...c.teamB].forEach(id=>{ const p=byId(id); if(p){ p.status = p.holdAfter?"hold":"waiting"; p.holdAfter=false; p.enteredAt=seq++; } }); }
    state.courts[i]=null; assignEmptyCourts(); render();
  });
  app.querySelectorAll("[data-hold]").forEach(b=> b.onclick=()=>{ holdPlayer(b.dataset.hold); render(); });
  app.querySelectorAll("[data-return]").forEach(b=> b.onclick=()=>{ returnPlayer(b.dataset.return); assignEmptyCourts(); render(); });
  app.querySelectorAll("[data-remove]").forEach(b=> b.onclick=()=>{ removePlayer(b.dataset.remove); render(); });
  const li=document.getElementById("liveInput");
  const add=()=>{ const raw=li.value; raw.split(/[,\n]/).map(s=>s.trim()).filter(Boolean).forEach(addPlayer); li.value=""; assignEmptyCourts(); render(); document.getElementById("liveInput").focus(); };
  document.getElementById("liveAdd").onclick=add;
  li.addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });
}

/* ============================================================
   Settings sheet
   ============================================================ */
const sheet=document.getElementById("sheet"), sheetBg=document.getElementById("sheetBg");
function openSheet(){ sheet.classList.add("open"); sheetBg.classList.add("open"); }
function closeSheet(){ sheet.classList.remove("open"); sheetBg.classList.remove("open"); }
document.getElementById("gear").onclick=openSheet;
sheetBg.onclick=closeSheet;

function syncSheet(){
  document.getElementById("cVal").textContent = state.courtsCount;
  document.querySelectorAll("#modeSeg button").forEach(b=> b.setAttribute("aria-pressed", String(b.dataset.mode===state.mode)));
}
document.getElementById("cMinus").onclick=()=>{ changeCourts(-1); };
document.getElementById("cPlus").onclick =()=>{ changeCourts(1); };
function changeCourts(d){
  state.courtsCount=Math.max(1,Math.min(12,state.courtsCount+d));
  if(state.started){
    // grow/shrink the live court list, then top up
    if(state.courts.length<state.courtsCount) while(state.courts.length<state.courtsCount) state.courts.push(null);
    if(state.courts.length>state.courtsCount){
      for(let i=state.courtsCount;i<state.courts.length;i++){ const c=state.courts[i]; if(c){[...c.teamA,...c.teamB].forEach(id=>{const p=byId(id);if(p){p.status="waiting";p.enteredAt=seq++;}});} }
      state.courts.length=state.courtsCount;
    }
    assignEmptyCourts();
  }
  render();
}
document.querySelectorAll("#modeSeg button").forEach(b=> b.onclick=()=>{
  if(state.mode===b.dataset.mode) return;
  state.mode=b.dataset.mode;
  if(state.started){ // re-pool everyone and rebuild courts for the new format
    state.players.forEach(p=>{ if(p.status==="playing"){p.status="waiting"; p.enteredAt=seq++;} });
    state.courts=new Array(state.courtsCount).fill(null);
    assignEmptyCourts();
  }
  render();
});
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Reset the whole session? Players, courts and game counts will be cleared.")){
    state=blankState(); seq=1; Store.clear(); closeSheet(); render();
  }
};

/* ============================================================
   Boot + service worker (guarded; skips silently in sandbox)
   ============================================================ */
render();
if ("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
